# ============================================================================
# Docker Compose — Oracle Cloud Free Tier
# ============================================================================
# Usage:
#   cp deploy/oracle/.env.example .env
#   nano .env  (édite les variables)
#   docker compose -f deploy/oracle/docker-compose.yml up -d --build
# ============================================================================

services:
  # --- PostgreSQL -----------------------------------------------------------
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: supone
      POSTGRES_USER: supone
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-supone_secret_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supone -d supone"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - supone-net

  # --- Backend Django -------------------------------------------------------
  api:
    build:
      context: ../..
      dockerfile: deploy/oracle/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8001"
      DATABASE_URL: postgres://supone:${POSTGRES_PASSWORD:-supone_secret_2026}@db:5432/supone
      SECRET_KEY: ${SECRET_KEY:?Définir SECRET_KEY dans .env}
      DEBUG: "False"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,api}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      HF_OFFLINE: "1"
      RUN_BOOTSTRAP: ${RUN_BOOTSTRAP:-0}
      SKIP_GEN3: ${SKIP_GEN3:-0}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-3}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - rag_data:/app/backend/rag_data
      - hf_cache:/app/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8001/api/health/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    networks:
      - supone-net

  # --- Nginx (reverse proxy + HTTPS) ----------------------------------------
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_certs:/etc/letsencrypt
      - nginx_www:/var/www/certbot
    depends_on:
      - api
    networks:
      - supone-net

  # --- Certbot (renouvellement SSL automatique) -----------------------------
  certbot:
    image: certbot/certbot
    volumes:
      - nginx_certs:/etc/letsencrypt
      - nginx_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - supone-net

volumes:
  postgres_data:
  rag_data:
  hf_cache:
  nginx_certs:
  nginx_www:

networks:
  supone-net:
    driver: bridge
