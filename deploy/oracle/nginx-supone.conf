# ============================================================================
# Nginx config — SUP'ONE AI (sans Docker, systemd)
# ============================================================================
# Usage:
#   sudo cp deploy/oracle/nginx-supone.conf /etc/nginx/sites-available/supone
#   sudo ln -sf /etc/nginx/sites-available/supone /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
# ============================================================================

server {
    listen 80;
    server_name suponeapi.com www.suponeapi.com;

    # Rediriger vers HTTPS (décommenter après SSL)
    # return 301 https://$host$request_uri;

    # --- API Backend --------------------------------------------------------
    location /api/ {
        proxy_pass http://unix:/run/supone/gunicorn.sock;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;

        # CORS
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept" always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }

    # --- Static files Django ------------------------------------------------
    location /static/ {
        alias /home/ubuntu/SupOneAI/backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # --- Health check -------------------------------------------------------
    location /health {
        proxy_pass http://unix:/run/supone/gunicorn.sock;
        proxy_set_header Host $host;
    }

    # --- Sécurité -----------------------------------------------------------
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
