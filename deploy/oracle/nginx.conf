# ============================================================================
# Nginx config — SUP'ONE AI (Oracle Cloud)
# ============================================================================
# Reverse proxy vers Gunicorn + Static files + SSL
# ============================================================================

# Cache pour les assets statiques
proxy_cache_path /tmp/nginx_cache levels=1:2 keys_zone=STATIC:10m max_size=100m inactive=7d;

server {
    listen 80;
    server_name _;

    # Rediriger vers HTTPS (décommenter après avoir configuré SSL)
    # return 301 https://$host$request_uri;

    # --- API Backend --------------------------------------------------------
    location /api/ {
        proxy_pass http://api:8001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;

        # CORS
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept" always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }

    # --- Static files Django ------------------------------------------------
    location /static/ {
        proxy_pass http://api:8001/static/;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # --- Health check -------------------------------------------------------
    location /health {
        proxy_pass http://api:8001/api/health/;
        proxy_set_header Host $host;
    }

    # --- Fichiers statiques frontend ----------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(js|css|png|svg|ico|webmanifest|woff2)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # --- Default (SPA fallback) ---------------------------------------------
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # --- Sécurité -----------------------------------------------------------
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

