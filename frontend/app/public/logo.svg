<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb"/>
      <stop offset="100%" style="stop-color:#1a4594"/>
    </linearGradient>
    <linearGradient id="bgInner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.12)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0)"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa"/>
      <stop offset="100%" style="stop-color:#1a4594"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="16" flood-color="#0d2d6b" flood-opacity="0.45"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bg)" filter="url(#shadow)"/>
  <circle cx="256" cy="256" r="240" fill="url(#bgInner)"/>

  <!-- Outer ring accent -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Speech bubble body -->
  <path d="M140 160 C140 132 162 110 190 110 L322 110 C350 110 372 132 372 160 L372 272 C372 300 350 322 322 322 L218 322 L180 358 L183 322 L190 322 C162 322 140 300 140 272 Z"
        fill="rgba(255,255,255,0.95)" rx="28"/>

  <!-- Sparkle / AI star - top right -->
  <g transform="translate(330, 140)" filter="url(#softGlow)">
    <!-- Main 4-point star -->
    <path d="M0,-24 L5,-5 L24,0 L5,5 L0,24 L-5,5 L-24,0 L-5,-5 Z" fill="url(#glow)" opacity="0.95"/>
    <!-- Small accent stars -->
    <circle cx="16" cy="-16" r="3.5" fill="#60a5fa" opacity="0.7"/>
    <circle cx="-12" cy="-19" r="2.5" fill="#93c5fd" opacity="0.5"/>
    <circle cx="12" cy="14" r="2" fill="#60a5fa" opacity="0.4"/>
  </g>

  <!-- Three animated dots in bubble -->
  <circle cx="210" cy="216" r="11" fill="#1a4594" opacity="0.9"/>
  <circle cx="252" cy="216" r="11" fill="#2563eb" opacity="0.75"/>
  <circle cx="294" cy="216" r="11" fill="#60a5fa" opacity="0.55"/>

  <!-- Subtle "AI" text in bubble -->
  <text x="252" y="270" text-anchor="middle" font-family="'Inter', sans-serif" font-size="28" font-weight="600" fill="#1a4594" opacity="0.15">AI</text>
</svg>
